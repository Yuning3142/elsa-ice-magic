<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Elsa · Ice Magic</title></head><body><div id="app"><video id="camera" autoplay muted playsinline></video><div id="veil"></div><div id="canvas-root"></div><header><div class="brand">❄ ELSA <span>ICE MAGIC</span></div><div class="status-box"><span class="status-label">状态</span><span id="status">点击启动摄像头</span></div></header><aside><h2>手势魔法</h2><p>✋ 张开手掌 · 雪花</p><p>☝ 食指指向 · 冰霜轨迹</p><p>✊ 握拳 · 能量蓄积</p><p>✊ 蓄力 0.5 秒 → ✋ 张开 · 冰晶爆炸</p><p>🙌 双手展开 · 暴风雪</p><p>⬆ 双手抬起 · 冰柱</p><p>👌 OK 手势 0.6 秒 · 雪花法阵</p><p>☝ 食指快甩 · 冰锥飞弹</p><p>👏 双手合拢 · 冰环冲击</p><p>✊✊ 双拳握 1.2 秒 · 冰封画面</p><p>✌ 剪刀手 0.8 秒 · 冰雪手套（再比一次脱下）</p><div class="tip">尽量让双手完整进入镜头。<br>按 H 隐藏面板，F 全屏。</div></aside><footer><button id="start">开启冰雪魔法</button><button id="sound" disabled>音效：关</button><label>强度 <input id="intensity" type="range" min="0.4" max="2" step="0.1" value="1"/></label><label title="往左：更难误触发；往右：更容易触发">灵敏度 <input id="sensitivity" type="range" min="0.5" max="1.5" step="0.1" value="1"/></label><button id="fullscreen">全屏</button></footer><div id="spell"></div></div><script type="module" src="/src/main.js"></script></body></html>
